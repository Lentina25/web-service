version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cosmetics_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cosmetics_preferences
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cosmetics_preferences"]
      interval: 5s
      timeout: 5s
      retries: 5

  web-service:
    build: ./web-service
    container_name: cosmetics_recommendation_api
    environment:
      - PORT=8002

  backend:
    build: ./backend
    container_name: cosmetics_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/cosmetics_preferences
      - WEB_SERVICE_URL=http://web-service:8002
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cosmetics_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
